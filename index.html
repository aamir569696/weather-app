<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="./image/faviicon (1).jpg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- section-one-start -->
    <section class="section-view1">
        <nav class="navbar">
            <h1>Productivity Dashboard</h1>
        </nav>

        <div class="view1">

            <div class="view-left">
                <div class="date">8 May 2026</div>
                <div class="time">
                    <div class="day">Friday</div>
                    <div class="time-day">10:15:23 </div>
                </div>
                <div class="line"></div>
                <div class="city">Lahore</div>
            </div>



            <div class="view-right">
                <div class="right-top">
                    <div class="temperature">34°C</div>
                    <div class="weather">clouds</div>
                </div>
                <div class="right-bottom">
                    <div class="huminity">Humidity: 16%</div>
                    <div class="wind">Wind Speed: 2 km/h</div>
                </div>

            </div>
        </div>



    </section>
    <!-- section-one-end -->

    <!-- section-two-start -->
    <section class="section-view2">

        <div class="main-view2">
            <!-- Full Screen Todo App -->
            <div class="todo-app" id="todoApp">
                <div class="close-btn" id="closeBtn">✕</div>
                <div class="todo-app-content" id="appContainer">
                    <h1></h1>
                </div>
            </div>

            <!-- To-do-List -->
            <div class="box-main" data-app="todo">
                <div class="box-image">
                    <img src="./image/chat1.jfif" alt="">
                </div>
                <div class="todo-text-holder">
                    <div class="todo-text">To-Do-List</div>
                    <div class="line"></div>
                </div>
            </div>

            <!-- Daily Planner -->
            <div class="box-main" data-app="planner">
                <div class="box-image">
                    <img src="./image/chat222.jfif" alt="">
                </div>
                <div class="todo-text-holder">
                    <div class="todo-text">Daily Planner</div>
                    <div class="line"></div>
                </div>
            </div>

            <!-- Motivation -->
            <div class="box-main" data-app="motivation">
                <div class="box-image">
                    <img src="./image/motivation.jpg" alt="">
                </div>

                <div class="todo-text-holder">
                    <div class="todo-text">Motivation</div>
                    <div class="line"></div>
                </div>
            </div>

            <!-- Pomodoro -->
            <div class="box-main" data-app="pomodoro">
                <div class="box-image">
                    <img src="./image/pomodorodark.png" alt="">
                </div>
                <div class="todo-text-holder">
                    <div class="todo-text">Pomodoro</div>
                    <div class="line"></div>
                </div>
            </div>

            <!-- Kanban Board -->
            <div class="box-main" data-app="kanban">
                <div class="box-image">
                    <img src="./image/kaban.jfif" alt="">
                </div>
                <div class="todo-text-holder">
                    <div class="todo-text">Kanban Board</div>
                    <div class="line"></div>
                </div>
            </div>

        </div>

    </section>
    <!-- section-two-end -->

    <script src="script.js" defer></script>

</body>
</html>
